<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue Control — India Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #080c18;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #64748b;
  --accent: #38bdf8;
  --accent-glow: rgba(56,189,248,0.15);
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.qc-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,14,26,0.85);
  backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 50;
}
.qc-header-left { display: flex; align-items: center; gap: 14px; }
.qc-header-left .logo-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px; font-weight: 800;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, #fff 30%, rgba(56,189,248,0.9));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.qc-header-left .logo-text span {
  -webkit-text-fill-color: var(--accent);
  color: var(--accent);
  background: none;
}
.qc-header-right { display: flex; align-items: center; gap: 12px; }
.qc-back-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text2);
  font-size: 13px; font-weight: 500;
  cursor: pointer; text-decoration: none;
  transition: all 0.2s;
}
.qc-back-btn:hover {
  background: var(--surface-hover);
  color: var(--text);
  border-color: var(--accent);
}
.qc-main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px;
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 28px;
}
.qc-left { min-width: 0; }
.qc-right { min-width: 0; }
.qc-right .qc-section-title { margin-top: 0; }
.qc-hero {
  text-align: center;
  margin-bottom: 36px;
}
.qc-hero-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text3);
  margin-bottom: 12px;
  font-weight: 600;
}
.qc-hero-token {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 96px;
  font-weight: 800;
  line-height: 1;
  color: var(--accent);
  text-shadow: 0 0 60px rgba(56,189,248,0.25);
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
.qc-hero-customer {
  font-size: 15px;
  color: var(--text2);
}
.qc-hero-status {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 12px;
  padding: 4px 14px;
  border-radius: 100px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.qc-hero-status.processing { background: rgba(56,189,248,0.1); color: var(--accent); border: 1px solid rgba(56,189,248,0.2); }
.qc-hero-status.waiting { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }
.qc-hero-status.completed { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
.qc-hero-status.none { background: var(--surface); color: var(--text3); border: 1px solid var(--border); }
.qc-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 32px;
}
.qc-action-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px;
  padding: 18px 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.qc-action-btn i { font-size: 20px; }
.qc-action-btn .qc-btn-desc {
  font-size: 9px; font-weight: 400; text-transform: none;
  color: var(--text3); letter-spacing: 0.02em; margin-top: 2px;
  opacity: 0.7; line-height: 1.3;
}
.qc-action-btn:hover {
  background: var(--surface-hover);
  border-color: var(--text3);
  color: var(--text);
  transform: translateY(-2px);
}
.qc-action-btn.next:hover { border-color: var(--green); color: var(--green); }
.qc-action-btn.complete:hover { border-color: var(--green); color: var(--green); }
.qc-action-btn.cancel:hover { border-color: var(--red); color: var(--red); }
.qc-action-btn.sendtolast:hover { border-color: var(--amber); color: var(--amber); }
.qc-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.qc-queue-list {
  display: flex; flex-direction: column; gap: 6px;
}
.qc-queue-item {
  display: flex; align-items: center;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  gap: 12px;
  transition: all 0.2s;
}
.qc-queue-item:hover { background: var(--surface-hover); }
.qc-queue-item .token {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px; font-weight: 700;
  color: var(--text);
  width: 40px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.qc-queue-item .info { flex: 1; }
.qc-queue-item .info .name { font-size: 14px; font-weight: 500; color: var(--text); }
.qc-queue-item .info .service { font-size: 12px; color: var(--text3); margin-top: 2px; }
.qc-queue-item .info .aadhaar { font-size: 11px; color: var(--text3); margin-top: 1px; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.1em; opacity: 0.7; }
.qc-queue-item .badge {
  font-size: 10px; font-weight: 600;
  padding: 3px 10px;
  border-radius: 100px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.qc-queue-item .badge.processing { background: rgba(56,189,248,0.1); color: var(--accent); }
.qc-queue-item .badge.waiting,
.qc-queue-item .badge.approved,
.qc-queue-item .badge.pending { background: rgba(245,158,11,0.1); color: var(--amber); }
.qc-queue-item .badge.completed { background: rgba(34,197,94,0.1); color: var(--green); }
.qc-queue-item .badge.cancelled { background: rgba(239,68,68,0.1); color: var(--red); }
.qc-empty {
  text-align: center;
  padding: 40px;
  color: var(--text3);
  font-size: 14px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 12px;
}
.qc-start-btn {
  display: none;
  width: 100%;
  align-items: center; justify-content: center; gap: 10px;
  padding: 16px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #059669, #10b981);
  color: #fff;
  border: none; border-radius: 14px;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.04em;
  box-shadow: 0 4px 24px rgba(16,185,129,0.35);
  transition: all 0.3s ease;
  animation: qc-start-glow 3s ease-in-out infinite;
}
.qc-start-btn:hover {
  box-shadow: 0 8px 40px rgba(16,185,129,0.55);
  transform: translateY(-2px) scale(1.02);
}
.qc-start-btn:active { transform: translateY(0) scale(0.98); }
.qc-start-btn.visible { display: flex; }
@keyframes qc-start-glow {
  0%, 100% { box-shadow: 0 4px 24px rgba(16,185,129,0.35), 0 0 0 rgba(16,185,129,0); }
  50% { box-shadow: 0 8px 40px rgba(16,185,129,0.55), 0 0 60px rgba(16,185,129,0.15); }
}
.qc-save-exit {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; margin-top: 8px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text3);
  font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit; text-transform: uppercase; letter-spacing: 0.05em;
  transition: all 0.2s; width: fit-content;
}
.qc-save-exit:hover { background: var(--surface-hover); color: var(--red); border-color: var(--red); }
.qc-saving-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
  height: 3px;
  background: rgba(255,255,255,0.05);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.qc-saving-bar.active { opacity: 1; }
.qc-saving-bar-inner {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #059669, #10b981, #38bdf8);
  border-radius: 0 2px 2px 0;
  transition: width 0.3s ease;
}
@media (max-width: 860px) {
  .qc-main { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .qc-actions { grid-template-columns: repeat(3, 1fr); }
  .qc-hero-token { font-size: 64px; }
  .qc-main { padding: 20px 16px; grid-template-columns: 1fr; }
  .qc-right { margin-top: 12px; }
}
</style>
</head>
<body>

<header class="qc-header">
  <div class="qc-header-left">
    <span class="logo-text">India <span>Mobile</span></span>
  </div>
  <div class="qc-header-right">
    <button class="qc-back-btn" onclick="window.open('https://indiamobileonline.vercel.app/live-token.html','_blank')"><i class="fas fa-hashtag"></i> Live Token</button>
    <a href="index.html" class="qc-back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
  </div>
</header>

<main class="qc-main">
  <div class="qc-left">
    <div class="qc-hero">
      <div class="qc-hero-label">Currently Serving</div>
      <div class="qc-hero-token" id="qcCurrentToken">--</div>
      <div class="qc-hero-customer" id="qcCurrentCustomer">No active token</div>
      <div class="qc-hero-status none" id="qcCurrentStatus">Idle</div>
    </div>

    <button class="qc-start-btn" id="qcStartBtn" onclick="qcStartQueue()">
      <i class="fas fa-play"></i> Start Queue
    </button>

    <div class="qc-actions">
    <button class="qc-action-btn next" onclick="qcCompleteAndNext()"><i class="fas fa-check-double"></i> Complete &amp; Next<span class="qc-btn-desc">Complete current, call next</span></button>
    <button class="qc-action-btn cancel" onclick="qcCancel()"><i class="fas fa-ban"></i> Cancel<span class="qc-btn-desc">Cancel current token</span></button>
    <button class="qc-action-btn sendtolast" onclick="qcSendToLast()"><i class="fas fa-forward"></i> Send to Last<span class="qc-btn-desc">Move to end of queue</span></button>
  </div>

  <button class="qc-save-exit" onclick="qcSaveExit()"><i class="fas fa-floppy-disk"></i> Save &amp; Exit</button>
  </div>

  <div class="qc-right">
    <div class="qc-section-title">Booking list</div>
    <div class="qc-queue-list" id="qcQueueList">
      <div class="qc-empty">Loading bookings...</div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
if (typeof firebase !== 'undefined' && !firebase.apps.length) {
  firebase.initializeApp({
    apiKey: "AIzaSyDgbUt2SMxd4glTjn4Z1S8oAq4bCmSobDQ",
    authDomain: "india-mobile-17134.firebaseapp.com",
    projectId: "india-mobile-17134",
    storageBucket: "india-mobile-17134.firebasestorage.app",
    messagingSenderId: "20187455448",
    appId: "1:20187455448:web:7f3d3bd09e8407ea389cad",
    measurementId: "G-3XVP6GQ9WX"
  });
}
function waitForAuth() {
  return new Promise(function(resolve) {
    var timedOut = false;
    var timer = setTimeout(function() { timedOut = true; resolve(); }, 3000);
    try {
      var unsubscribe = firebase.auth().onAuthStateChanged(function(user) {
        if (timedOut) return;
        clearTimeout(timer);
        unsubscribe();
        if (user) console.log('[QC] Auth restored for', user.email);
        else console.log('[QC] No auth — using API fallback');
        resolve();
      });
    } catch(e) {
      clearTimeout(timer);
      resolve();
    }
  });
}
</script>
<script src="db-sync.js"></script>
<script>
waitForAuth().then(function() {
  DBSync.initFirestore().then(ok => {
    if (ok) DBSync.startRealtimeListener();
    else DBSync.forceFetch().then(() => DBSync.startPolling(3000));
  });
});

let queueData = [];
let _qcAuthorized = false;
let _qcLastHash = '';
var _qcRefreshTimer = null;

(function() {
  const params = new URLSearchParams(window.location.search);
  const key = params.get('key');
  const stored = sessionStorage.getItem('qc_auth');
  if (key && stored && key === stored) {
    _qcAuthorized = true;
    sessionStorage.removeItem('qc_auth');
  } else {
    window.location.href = 'https://indiamobile-admin.vercel.app/';
    return;
  }
})();

function notify(msg, type) {
  const colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#38bdf8' };
  const el = document.getElementById('qcNotif') || (() => {
    const n = document.createElement('div');
    n.id = 'qcNotif';
    n.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:9999;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;transition:all 0.3s;opacity:0;font-family:Inter,sans-serif;background:rgba(12,16,30,0.95);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,0.5);';
    document.body.appendChild(n);
    return n;
  })();
  el.textContent = msg;
  el.style.color = colors[type] || colors.info;
  el.style.borderColor = (colors[type] || colors.info) + '33';
  el.style.transform = 'translateX(-50%) translateY(0)';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.transform = 'translateX(-50%) translateY(80px)'; el.style.opacity = '0'; }, 3000);
}

function logQCAction(action, token, result) {
  console.log('[QC]', action, token, result);
}

function refreshQueue() {
  if (_qcRefreshTimer) clearTimeout(_qcRefreshTimer);
  _qcRefreshTimer = setTimeout(function() {
    var hash = DBSync.getToken() + '|' + (DBSync.getBookings() || []).length;
    if (hash === _qcLastHash) return;
    _qcLastHash = hash;

    const bookings = DBSync.getBookings();
    queueData = bookings.filter(b => b.status === 'approved' || b.status === 'pending' || b.status === 'waiting' || b.status === 'processing');
    queueData.sort((a, b) => parseInt(a.token) - parseInt(b.token));

    const ct = DBSync.getToken();
    const startBtn = document.getElementById('qcStartBtn');
    if (startBtn) startBtn.classList.toggle('visible', ct <= 0);

    const current = queueData.find(b => parseInt(b.token) === ct && (b.status === 'processing' || b.status === 'approved' || b.status === 'waiting' || b.status === 'pending'));

    var tokenEl = document.getElementById('qcCurrentToken');
    if (tokenEl) tokenEl.textContent = ct > 0 ? String(ct).padStart(2, '0') : '--';
    var custEl = document.getElementById('qcCurrentCustomer');
    var statusEl = document.getElementById('qcCurrentStatus');
    if (current && custEl && statusEl) {
      custEl.textContent = (current.name || 'Unknown') + ' — ' + (current.service || 'Aadhaar Update');
      statusEl.textContent = current.status === 'processing' ? 'Processing' : 'Waiting';
      statusEl.className = 'qc-hero-status ' + (current.status === 'processing' ? 'processing' : 'waiting');
    } else {
      if (custEl) custEl.textContent = ct > 0 ? 'No active booking for this token' : 'No active token';
      if (statusEl) { statusEl.textContent = 'Idle'; statusEl.className = 'qc-hero-status none'; }
    }

    renderQueueList();
  }, 100);
}

function renderQueueList() {
  const el = document.getElementById('qcQueueList');
  if (!queueData.length) {
    el.innerHTML = '<div class="qc-empty">No bookings waiting in queue.</div>';
    return;
  }
  el.innerHTML = queueData.map(b => {
    const statusClass = b.status === 'approved' || b.status === 'pending' || b.status === 'waiting' ? 'waiting' : b.status;
    const statusLabel = b.status === 'approved' ? 'Waiting' : b.status.charAt(0).toUpperCase() + b.status.slice(1);
    return `<div class="qc-queue-item">
      <div class="token">${String(b.token).padStart(2, '0')}</div>
      <div class="info">
        <div class="name">${b.name || 'N/A'}</div>
        <div class="service">${b.service || 'Aadhaar Update'}</div>
        <div class="aadhaar">xxxx xxxx ${b.aadhaarLast4 || '----'}</div>
      </div>
      <span class="badge ${statusClass}">${statusLabel}</span>
    </div>`;
  }).join('');
}

async function qcStartQueue() {
  const bookings = DBSync.getBookings();
  const waiting = bookings.filter(b => b.status === 'approved' || b.status === 'pending' || b.status === 'waiting');
  waiting.sort((a, b) => parseInt(a.token) - parseInt(b.token));
  if (waiting.length === 0) { notify('No bookings waiting to start the queue.', 'error'); return; }
  const first = waiting[0];
  if (!(await showQCModal('Start queue at Token #' + String(first.token).padStart(2, '0') + ' (' + (first.name || 'Customer') + ')?'))) return;
  DBSync.setToken(parseInt(first.token));
  logQCAction('Started Queue', first.token, 'Success');
  notify('Queue started at #' + String(first.token).padStart(2, '0'), 'success');
  refreshQueue();
}

async function qcCompleteAndNext() {
  const ct = DBSync.getToken();
  const bookings = DBSync.getBookings();
  const b = bookings.find(x => parseInt(x.token) === ct && (x.status === 'processing' || x.status === 'approved' || x.status === 'waiting'));
  if (!b) { notify('No active token to complete.', 'error'); return; }
  if (!(await showQCModal('Complete #' + String(ct).padStart(2, '0') + ' (' + (b.name || 'Customer') + ') and call next?'))) return;
  b.status = 'completed';
  const waiting = bookings.filter(x => x.status === 'approved' || x.status === 'pending' || x.status === 'waiting');
  waiting.sort((a, x) => parseInt(a.token) - parseInt(x.token));
  if (waiting.length > 0) {
    const next = waiting[0];
    next.status = 'processing';
    DBSync.setToken(parseInt(next.token));
    logQCAction('Complete & Next', next.token, 'Success');
    notify('#' + String(ct).padStart(2, '0') + ' done → Called #' + String(next.token).padStart(2, '0') + ' (' + (next.name || 'Customer') + ')', 'success');
  } else {
    DBSync.setToken(0);
    logQCAction('Complete & Next (end)', ct, 'Success');
    notify('#' + String(ct).padStart(2, '0') + ' completed. No more customers in queue.', 'success');
  }
  DBSync.setBookings(bookings);
  refreshQueue();
}

async function qcCancel() {
  const ct = DBSync.getToken();
  const bookings = DBSync.getBookings();
  const b = bookings.find(x => parseInt(x.token) === ct && (x.status === 'processing' || x.status === 'approved' || x.status === 'waiting'));
  if (!b) { notify('No active token to cancel.', 'error'); return; }
  if (!(await showQCModal('Cancel #' + String(ct).padStart(2, '0') + ' (' + (b.name || 'Customer') + ')? This cannot be undone.'))) return;
  b.status = 'cancelled';
  DBSync.setBookings(bookings);
  logQCAction('Cancelled', ct, 'Success');
  notify('#' + String(ct).padStart(2, '0') + ' cancelled.', 'error');
  refreshQueue();
}

async function qcSendToLast() {
  const bookings = DBSync.getBookings();
  const processing = bookings.find(b => b.status === 'processing');
  if (!processing) { notify('No customer currently being served.', 'error'); return; }
  if (!(await showQCModal('Send #' + String(processing.token).padStart(2, '0') + ' (' + (processing.name || 'Customer') + ') to the end of queue?'))) return;
  processing.status = 'approved';
  DBSync.setBookings(bookings);
  logQCAction('Sent To Last', processing.token, 'Success');
  notify('#' + String(processing.token).padStart(2, '0') + ' moved to end of queue.', 'warning');
  refreshQueue();
}

async function qcSaveExit() {
  if (!(await showQCModal('Save current state and exit? The live token will be reset.'))) return;
  DBSync.setToken(0);
  logQCAction('Saved & Exited', '--', 'Success');
  notify('State saved. Redirecting to dashboard...', 'info');
  setTimeout(function() { window.location.href = 'index.html'; }, 800);
}
  notify('#' + String(ct).padStart(2, '0') + ' marked no-show.', 'warning');
  refreshQueue();
}

if (_qcAuthorized) {
  DBSync.subscribe(() => refreshQueue());
  setTimeout(refreshQueue, 500);
}

// -- beforeunload: saving bar --
window.addEventListener('beforeunload', function(e) {
  e.preventDefault();
  e.returnValue = '';
});

// -- Confirmation Modal --
let _qcModalResolve = null;
function showQCModal(msg) {
  return new Promise(resolve => {
    _qcModalResolve = resolve;
    document.getElementById('qcModalMsg').textContent = msg;
    document.getElementById('qcModalOverlay').classList.add('open');
    document.getElementById('qcModalConfirm').classList.remove('loading');
    document.getElementById('qcModalConfirm').querySelector('.modal-btn-text').textContent = 'Yes, Continue';
    setTimeout(() => document.getElementById('qcModalConfirm').focus(), 100);
  });
}
function closeQCModal(result, event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('qcModalOverlay').classList.remove('open');
  if (_qcModalResolve) { _qcModalResolve(result); _qcModalResolve = null; }
}
function execQCModal() {
  const btn = document.getElementById('qcModalConfirm');
  btn.classList.add('loading');
  setTimeout(() => {
    document.getElementById('qcModalOverlay').classList.remove('open');
    if (_qcModalResolve) { _qcModalResolve(true); _qcModalResolve = null; }
  }, 300);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('qcModalOverlay')?.classList.contains('open')) closeQCModal(false);
});
</script>

<!-- CONFIRMATION MODAL -->
<div id="qcModalOverlay" class="modal-overlay" onclick="closeQCModal(null, event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-glow"></div>
    <div class="modal-icon-wrap"><div class="modal-icon"><i class="fas fa-exclamation-triangle"></i></div></div>
    <h3 class="modal-title">Confirm Action</h3>
    <p class="modal-msg" id="qcModalMsg">Are you sure?</p>
    <p class="modal-warning"><i class="fas fa-shield-halved"></i> This action may affect customer bookings, queue status, or system data.</p>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" onclick="closeQCModal(false)">Cancel</button>
      <button class="modal-btn modal-btn-primary" id="qcModalConfirm" onclick="execQCModal()">
        <span class="modal-btn-text">Yes, Continue</span>
        <span class="modal-btn-loader"><i class="fas fa-circle-notch fa-spin"></i></span>
      </button>
    </div>
    <button class="modal-close" onclick="closeQCModal(false)" aria-label="Close"><i class="fas fa-xmark"></i></button>
  </div>
</div>
